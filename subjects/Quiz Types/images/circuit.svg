<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Series circuit with a cell, a switch, a lamp and an ammeter">
  <rect width="400" height="260" fill="#ffffff"/>
  <g fill="none" stroke="#1f2933" stroke-width="3" stroke-linecap="round">
    <!-- wires -->
    <path d="M60 60 H150"/><path d="M210 60 H340 V112"/><path d="M340 148 V200 H224"/>
    <path d="M176 200 H60 V150"/><path d="M60 110 V60"/>
    <!-- cell: long plate (+) and short plate (-) -->
    <path d="M40 110 H80"/><path d="M50 122 H70" stroke-width="6"/>
    <path d="M60 122 V150"/>
    <!-- switch (open) -->
    <circle cx="150" cy="60" r="3" fill="#1f2933"/><circle cx="210" cy="60" r="3" fill="#1f2933"/>
    <path d="M150 60 L200 38"/>
    <!-- lamp -->
    <circle cx="340" cy="130" r="18" fill="#fff8dc"/><path d="M327 117 L353 143 M353 117 L327 143" stroke-width="2.5"/>
    <!-- ammeter -->
    <circle cx="200" cy="200" r="24" fill="#eef6ff"/>
  </g>
  <text x="200" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2933">A</text>
</svg>
